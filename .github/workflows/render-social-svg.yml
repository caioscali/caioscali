name: Render and import social SVG

on:
  push:
    branches: [main]
    paths:
      - 'social-staging/*.svg'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick jq

      - name: Render and import
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CHANGED="$(git show --pretty='' --name-only HEAD -- 'social-staging/*.svg' | sed '/^$/d')"
          [ -n "$CHANGED" ] || exit 0

          JPGS=""

          while read -r SVG; do
            [ -n "$SVG" ] || continue
            BASE="${SVG%.svg}"
            PNG="${BASE}.png"
            JPG="${BASE}.jpg"

            rsvg-convert -w 1080 -h 1080 "$SVG" -o "$PNG"
            convert "$PNG" -background '#090D0F' -alpha remove -alpha off -quality 92 "$JPG"
            rm -f "$PNG"
            git add "$JPG"
            JPGS="${JPGS}${JPG}
"
          done <<< "$CHANGED"

          git commit -m "Render social media JPEG" || true
          git push origin main

          NEW_SHA="$(git rev-parse HEAD)"

          printf "%b" "$JPGS" | while read -r JPG; do
            [ -n "$JPG" ] || continue
            SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NEW_SHA}/${JPG}"

            RESPONSE="$(curl --fail --silent --show-error --get               "https://scali.dev/api/social-media/import"               --data-urlencode "source=${SOURCE}")"

            echo "$RESPONSE"
            echo "Public URL: $(echo "$RESPONSE" | jq -r '.url')"
          done
